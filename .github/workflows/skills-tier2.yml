name: Skills Tier 2 Deduplication (Manual Spike)

on:
  workflow_dispatch:
    inputs:
      embedding_prefix:
        description: "Embedding text prefix mode"
        required: true
        type: choice
        options:
          - passage
          - none
        default: passage
      embedding_bos:
        description: "disabled = write add_bos_token=false into a derived GGUF (diagnostic)"
        required: true
        type: choice
        options:
          - default
          - disabled
        default: default
      embedding_file:
        description: "GGUF Quantization File for Nemotron-3-Embed-1B"
        required: true
        type: choice
        options:
          - q8_0
          - f16
          - q4_k_m
        default: q8_0
      llm_model:
        description: "Ollama LLM Model for dedup-scan"
        required: true
        type: string
        default: "gemma4:e2b"
      recompute_reference:
        description: "Force recomputing the reference cosine matrix from official BF16 weights"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: skills-tier2-spike
  cancel-in-progress: false

jobs:
  reference:
    name: Compute Reference Cosine Matrix (Optional)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Check if reference matrix exists
        id: check_ref
        run: |
          if [ -f "tests/resources/tier2_reference_cosines.json" ] && [ "${{ inputs.recompute_reference }}" != "true" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.check_ref.outputs.exists != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyTorch and Transformers
        if: steps.check_ref.outputs.exists != 'true'
        run: |
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir transformers accelerate

      - name: Compute Reference Cosines from BF16
        if: steps.check_ref.outputs.exists != 'true'
        run: |
          export COMPUTE_ONLY=true
          python3 .github/tier2/probes/probe_reference_cosines.py

      - name: Upload Reference Artifact
        if: steps.check_ref.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tier2-reference-cosines
          path: tests/resources/tier2_reference_cosines.json
          retention-days: 14

  tier2-dedup:
    name: Tier 2 Deduplication Run
    needs: [reference]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      OLLAMA_HOST: "127.0.0.1:11434"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_CONTEXT_LENGTH: "32768"
      SKILL_EVAL_EMBEDDING_PROVIDER: "openai-compatible"
      SKILL_EVAL_EMBEDDING_BASE_URL: ${{ inputs.embedding_prefix == 'none' && 'http://127.0.0.1:11434/v1' || 'http://127.0.0.1:11435/v1' }}
      SKILL_EVAL_EMBEDDING_API_KEY: "ollama"
      SKILL_EVAL_EMBEDDING_MODEL: "nemotron-3-embed-1b"
      SKILL_EVAL_LLM_PROVIDER: "openai-compatible"
      SKILL_EVAL_LLM_BASE_URL: "http://127.0.0.1:11434/v1"
      SKILL_EVAL_LLM_API_KEY: "ollama"
      SKILL_EVAL_LLM_MODEL: "${{ inputs.llm_model }}"
    steps:
      - uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Download Reference Artifact (if computed)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: tier2-reference-cosines
          path: tests/resources/

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install SkillEvaluator
        run: |
          uv tool install --python 3.13 --with "openai>=2.21.0" \
            "skillevaluator @ git+https://github.com/NVIDIA/SkillEvaluator.git@a61e1f3ff609118c0c07e5f569aaf58fa5a76be0"
          pip install openai

      - name: Cache Model Files
        id: cache-models
        uses: actions/cache@v4
        with:
          path: ~/.cache/tier2_models
          key: tier2-models-${{ hashFiles('.github/tier2/pins.env') }}-${{ inputs.embedding_file }}

      - name: Setup Ollama and Models
        id: setup-ollama
        env:
          TIER2_EMBED_ADD_BOS: ${{ inputs.embedding_bos }}
        run: |
          start_time=$(date +%s)
          .github/tier2/setup_ollama.sh "${{ inputs.embedding_file }}" "${{ inputs.llm_model }}"
          end_time=$(date +%s)
          echo "SETUP_DURATION=$((end_time - start_time))" >> "$GITHUB_ENV"

      - name: Start Passage-Prefix Proxy (if enabled)
        id: start-proxy
        run: |
          if [ "${{ inputs.embedding_prefix }}" = "passage" ]; then
            echo "Starting passage-prefix proxy in background..."
            export TIER2_EMBED_PROXY_PORT=11435
            export TIER2_UPSTREAM="http://127.0.0.1:11434"
            python3 .github/tier2/embed_prefix_proxy.py > embed_proxy.log 2>&1 &
            PROXY_PID=$!
            echo "Proxy PID: $PROXY_PID"

            RETRIES=60
            until curl -s "http://127.0.0.1:11435/api/version" >/dev/null 2>&1 || [ $RETRIES -eq 0 ]; do
              sleep 1
              RETRIES=$((RETRIES - 1))
            done

            if [ $RETRIES -eq 0 ]; then
              echo "Error: Passage-prefix proxy failed to respond on http://127.0.0.1:11435/api/version within 60s" >&2
              [ -f embed_proxy.log ] && cat embed_proxy.log >&2
              exit 1
            fi

            echo "✓ Passage-prefix proxy is responding."
          else
            echo "Embedding prefix proxy disabled ('none' mode). Direct upstream embedding in use."
          fi
          echo "Effective embedding base URL: $SKILL_EVAL_EMBEDDING_BASE_URL"

      # PROBES (Each runs as its own distinct step)
      - name: "Probe A: Embeddings Endpoint"
        id: probe-embeddings
        continue-on-error: true
        run: |
          start_time=$(date +%s)
          python3 .github/tier2/probes/probe_embeddings.py | tee probe_a.log
          end_time=$(date +%s)
          echo "PROBE_A_DURATION=$((end_time - start_time))" >> "$GITHUB_ENV"

      - name: "Probe B: Embedding Correctness vs Reference"
        id: probe-reference
        continue-on-error: true
        run: |
          start_time=$(date +%s)
          python3 .github/tier2/probes/probe_reference_cosines.py | tee probe_b.log
          end_time=$(date +%s)
          echo "PROBE_B_DURATION=$((end_time - start_time))" >> "$GITHUB_ENV"

      - name: "Probe C: LLM Structured Output & Latency"
        id: probe-llm
        continue-on-error: true
        run: |
          start_time=$(date +%s)
          python3 .github/tier2/probes/probe_llm_json.py | tee probe_c.log
          end_time=$(date +%s)
          echo "PROBE_C_DURATION=$((end_time - start_time))" >> "$GITHUB_ENV"

      - name: "Probe D: Canary Positive Control"
        id: probe-canary
        continue-on-error: true
        run: |
          start_time=$(date +%s)
          .github/tier2/probes/probe_canary.sh | tee probe_d.log
          end_time=$(date +%s)
          echo "PROBE_D_DURATION=$((end_time - start_time))" >> "$GITHUB_ENV"

      # EVALUATION
      - name: "Run Tier 2 Deduplication on Skills"
        id: eval-tier2
        continue-on-error: true
        run: |
          start_time=$(date +%s)
          export TIER2_REPORTS_DIR="tier2_reports"
          ./eval-skills-tier2.sh | tee eval_tier2.log
          end_time=$(date +%s)
          echo "EVAL_DURATION=$((end_time - start_time))" >> "$GITHUB_ENV"

      - name: Generate GitHub Step Summary
        if: always()
        run: |
          echo "## SkillEvaluator Tier 2 Deduplication Spike Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Runner Conclusion**: \`${{ job.status }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Embedding Prefix Mode**: \`${{ inputs.embedding_prefix }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Embedding BOS mode**: \`${{ inputs.embedding_bos }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Embedding Base URL**: \`$SKILL_EVAL_EMBEDDING_BASE_URL\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Effective embedding base URL: $SKILL_EVAL_EMBEDDING_BASE_URL"
          if [ "${{ inputs.embedding_prefix }}" = "passage" ]; then
            REQ_COUNT=0
            INPUT_COUNT=0
            if [ -f embed_proxy.log ]; then
              REQ_COUNT=$(grep -c "^embeddings:" embed_proxy.log || true)
              INPUT_COUNT=$(grep "^embeddings:" embed_proxy.log | sed -E 's/.*inputs=([0-9]+).*/\1/' | awk '{s+=$1} END {print s+0}')
            fi
            echo "- **Proxy-handled embedding requests**: $REQ_COUNT (inputs: $INPUT_COUNT)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$HOME/.cache/tier2_models/patched_gguf.sha256" ]; then
            PATCHED_SHA=$(cat "$HOME/.cache/tier2_models/patched_gguf.sha256")
            echo "- **Patched GGUF sha256**: \`$PATCHED_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f probe_b.log ]; then
            PROBE_B_LINE=$(grep "^PROBE_B_JSON:" probe_b.log | tail -n 1 | sed 's/^PROBE_B_JSON: //' || true)
            if [ -n "$PROBE_B_LINE" ]; then
              BEST_VAR=$(echo "$PROBE_B_LINE" | jq -r '.best_variant // empty' 2>/dev/null || true)
              DEF_VAR=$(echo "$PROBE_B_LINE" | jq -r '.default_variant // "none"' 2>/dev/null || true)
              if [ -n "$BEST_VAR" ]; then
                echo "- **Probe B best reference variant**: $BEST_VAR (tokenizer default: $DEF_VAR)" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          fi
          echo "- **Embedding Quantization**: \`${{ inputs.embedding_file }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **LLM Model**: \`${{ inputs.llm_model }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### Stage Outcomes & Timings" >> "$GITHUB_STEP_SUMMARY"
          echo "| Stage | Outcome | Duration (s) |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Setup Ollama & Models | \`${{ steps.setup-ollama.outcome }}\` | ${SETUP_DURATION:-N/A}s |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Probe A (Embeddings) | \`${{ steps.probe-embeddings.outcome }}\` | ${PROBE_A_DURATION:-N/A}s |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Probe B (Correctness) | \`${{ steps.probe-reference.outcome }}\` | ${PROBE_B_DURATION:-N/A}s |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Probe C (LLM Schema) | \`${{ steps.probe-llm.outcome }}\` | ${PROBE_C_DURATION:-N/A}s |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Probe D (Canary) | \`${{ steps.probe-canary.outcome }}\` | ${PROBE_D_DURATION:-N/A}s |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Skills Evaluation | \`${{ steps.eval-tier2.outcome }}\` | ${EVAL_DURATION:-N/A}s |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### Ollama Status & Diagnostics" >> "$GITHUB_STEP_SUMMARY"
          {
            echo '```text'
            ollama ps || true
            echo
            curl -s http://127.0.0.1:11434/api/ps | jq . 2>/dev/null || curl -s http://127.0.0.1:11434/api/ps || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          SERVER_LOG="$HOME/.cache/tier2_models/ollama_server.log"
          TRUNC_COUNT=0
          if [ -f "$SERVER_LOG" ]; then
            TRUNC_COUNT=$(grep -ci "truncating input prompt" "$SERVER_LOG" || true)
          fi
          echo "- **Prompt truncation events**: $TRUNC_COUNT" >> "$GITHUB_STEP_SUMMARY"
          if [ "$TRUNC_COUNT" -gt 0 ]; then
            {
              echo '  ```text'
              grep -i "truncating input prompt" "$SERVER_LOG" | head -n 3 || true
              echo '  ```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### System Resources" >> "$GITHUB_STEP_SUMMARY"
          {
            echo '```text'
            free -h || true
            df -h || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -f eval_tier2.log ]; then
            echo "### Evaluation Output" >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`text" >> "$GITHUB_STEP_SUMMARY"
            cat eval_tier2.log >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify Stage Outcomes
        if: always()
        run: |
          if [ "${{ steps.probe-embeddings.outcome }}" != "success" ] || \
             [ "${{ steps.probe-reference.outcome }}" != "success" ] || \
             [ "${{ steps.probe-llm.outcome }}" != "success" ] || \
             [ "${{ steps.probe-canary.outcome }}" != "success" ] || \
             [ "${{ steps.eval-tier2.outcome }}" != "success" ]; then
            echo "Error: One or more validation stages failed or did not complete successfully." >&2
            exit 1
          fi

      - name: Collect Logs and Reports for Upload
        if: always()
        run: |
          mkdir -p tier2_logs
          MODELS_DIR="$HOME/.cache/tier2_models"
          [ -f "$MODELS_DIR/ollama_server.log" ] && cp "$MODELS_DIR/ollama_server.log" tier2_logs/
          [ -f "$MODELS_DIR/ollama_create.log" ] && cp "$MODELS_DIR/ollama_create.log" tier2_logs/
          [ -f "$MODELS_DIR/ollama_pull.log" ] && cp "$MODELS_DIR/ollama_pull.log" tier2_logs/
          ls -la tier2_logs/ || true

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier2-spike-logs-and-reports
          path: |
            tier2_reports/**
            tier2_logs/**
            *.log
          retention-days: 14
