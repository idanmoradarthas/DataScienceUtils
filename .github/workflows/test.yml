name: Build

on:
  push:
  pull_request:
    types: [ opened, reopened ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ "3.11", "3.12", "3.13", "3.14" ]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
          python-version: ${{ matrix.python-version }}

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Set TCL/TK Environment Variables
        if: runner.os == 'Windows'
        run: |
          $pythonLocation = uv python find ${{ matrix.python-version }}
          $pythonDir = Split-Path $pythonLocation
          echo "TCL_LIBRARY=$pythonDir\tcl\tcl8.6" >> $env:GITHUB_ENV
          echo "TK_LIBRARY=$pythonDir\tcl\tk8.6" >> $env:GITHUB_ENV
          echo "MPLBACKEND=Agg" >> $env:GITHUB_ENV
        shell: powershell

      - name: Install graphviz binaries for Linux (${{ runner.arch }})
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get -y install graphviz

      - name: Install graphviz binaries & Chromium for Windows (${{ runner.arch }})
        if: runner.os == 'Windows'
        run: choco install -y graphviz chromium

      - name: Install graphviz binaries for macOS (${{ runner.arch }})
        if: runner.os == 'macOS'
        run: brew install graphviz

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Validate rendering fingerprint
        run: |
          uv run python -c "
          from matplotlib import ft2font, __version__ as v
          print(f'Matplotlib: {v}, FreeType: {ft2font.__freetype_version__}, Build: {ft2font.__freetype_build_type__}')
          "

      - name: Run tests
        run: uv run pytest --mpl --cov-config=.coveragerc --cov=ds_utils --cov-report=xml -n auto
        env:
          PYTHONPATH: "."
          OMP_NUM_THREADS: "1"
          DISPLAY: ":99"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: ${{ matrix.os }}-python-${{ matrix.python-version }}
          fail_ci_if_error: true

      - name: Run Ruff Formatter Check
        run: uvx ruff format --check .

      - name: Run Ruff Linter
        run: uvx ruff check .

  skills-scripts-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        if: runner.os == 'Linux'
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"

      - name: Install SkillEvaluator and SkillSpector
        if: runner.os == 'Linux'
        run: |
          while IFS= read -r line || [ -n "$line" ]; do
            line=$(echo "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            [[ -z "$line" || "$line" =~ ^# ]] && continue
            uv tool install --python 3.13 "$line"
          done < requirements-skills.txt
          uv tool install --python 3.13 --force --with "openai>=2.21.0" "$(grep -E '^skillevaluator' requirements-skills.txt)"

      - name: Install Gitleaks
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run Installer Test Suite
        run: bash tests/test_installer.sh

      - name: Run Evaluator Test Suite
        run: bash tests/test_evaluator.sh
        env:
          REQUIRE_REAL_EVALUATOR: ${{ runner.os == 'Linux' && '1' || '0' }}

  skills-installer-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test install.ps1 Success and Failure Paths
        shell: powershell
        run: |
          # 1. Start local mock HTTP server serving repository root
          $serverProcess = Start-Process python -ArgumentList "-m", "http.server", "18895" -PassThru
          Start-Sleep -Seconds 2

          try {
              $env:RAW_URL = "http://127.0.0.1:18895"
              $testDir = Join-Path $env:TEMP "test_install_ps1_success"
              New-Item -ItemType Directory -Force -Path $testDir | Out-Null

              Push-Location $testDir
              powershell -File (Join-Path $env:GITHUB_WORKSPACE "install.ps1") -SkillsOnly -Silent -Tools claude
              $successExit = $LASTEXITCODE
              Pop-Location

              if ($successExit -ne 0) {
                  throw "install.ps1 failed on valid server with exit code $successExit"
              }

              # Verify all 6 skills and api_reference.md exist
              $skills = @("metrics", "preprocess", "unsupervised", "strings", "transformers", "xai")
              foreach ($s in $skills) {
                  $skillPath = Join-Path $testDir ".claude\skills\ds-utils-$s\SKILL.md"
                  $refPath   = Join-Path $testDir ".claude\skills\ds-utils-$s\references\api_reference.md"
                  if (-not (Test-Path $skillPath)) { throw "Missing $skillPath" }
                  if (-not (Test-Path $refPath))   { throw "Missing $refPath" }
              }
              Write-Host "Success path verified: all files present and exit code 0."

              # 2. Test non-silent interactive flow piped with confirmation
              $env:RAW_URL = "http://127.0.0.1:18895"

              # Remove any pre-existing skills under $HOME
              foreach ($s in $skills) {
                  $legacySkillDir = Join-Path $HOME ".claude\skills\ds-utils-$s"
                  if (Test-Path $legacySkillDir) {
                      Remove-Item $legacySkillDir -Recurse -Force -ErrorAction SilentlyContinue
                  }
              }

              try {
                  $nonSilentOutput = "y" | powershell -File (Join-Path $env:GITHUB_WORKSPACE "install.ps1") -Global -SkillsOnly -Tools claude
                  $nonSilentExit = $LASTEXITCODE

                  if ($nonSilentExit -ne 0) {
                      throw "Non-silent install.ps1 failed with exit code $nonSilentExit"
                  }
                  $outputJoined = $nonSilentOutput -join "`n"
                  if (-not $outputJoined.Contains("Installation Outcome")) {
                      throw "Non-silent install.ps1 output missing 'Installation Outcome'"
                  }
                  foreach ($s in $skills) {
                      $skillPath = Join-Path $HOME ".claude\skills\ds-utils-$s\SKILL.md"
                      $refPath   = Join-Path $HOME ".claude\skills\ds-utils-$s\references\api_reference.md"
                      if (-not (Test-Path $skillPath)) { throw "Missing $skillPath in user profile" }
                      if (-not (Test-Path $refPath))   { throw "Missing $refPath in user profile" }
                  }
                  Write-Host "Non-silent interactive flow verified: exit code 0, summary printed, files present."
              } finally {
                  foreach ($s in $skills) {
                      $legacySkillDir = Join-Path $HOME ".claude\skills\ds-utils-$s"
                      if (Test-Path $legacySkillDir) {
                          Remove-Item $legacySkillDir -Recurse -Force -ErrorAction SilentlyContinue
                      }
                  }
              }

              # 3. Test failure path (unreachable URL)
              $failDir = Join-Path $env:TEMP "test_install_ps1_fail"
              New-Item -ItemType Directory -Force -Path $failDir | Out-Null
              $env:RAW_URL = "http://127.0.0.1:1"

              Push-Location $failDir
              powershell -File (Join-Path $env:GITHUB_WORKSPACE "install.ps1") -SkillsOnly -Silent -Tools claude
              $failExit = $LASTEXITCODE
              Pop-Location

              if ($failExit -eq 0) {
                  throw "install.ps1 unexpectedly succeeded with exit code 0 on unreachable server"
              }
              Write-Host "Failure path verified: exited non-zero ($failExit) on download failure."
              $global:LASTEXITCODE = 0
          } finally {
              Stop-Process -Id $serverProcess.Id -Force -ErrorAction SilentlyContinue
          }
