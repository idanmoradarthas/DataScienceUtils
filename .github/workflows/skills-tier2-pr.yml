name: Skills Tier 2 (PR)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: skills-tier2-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  similarity:
    name: "Tier 2 similarity (blocking)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TIER2_MODE: similarity
      OLLAMA_HOST: "127.0.0.1:11434"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_CONTEXT_LENGTH: "32768"
      SKILL_EVAL_EMBEDDING_PROVIDER: openai-compatible
      SKILL_EVAL_EMBEDDING_BASE_URL: http://127.0.0.1:11435/v1
      SKILL_EVAL_EMBEDDING_API_KEY: ollama
      SKILL_EVAL_EMBEDDING_MODEL: nemotron-3-embed-1b
      SKILL_EVAL_LLM_PROVIDER: openai-compatible
      SKILL_EVAL_LLM_BASE_URL: http://127.0.0.1:11434/v1
      SKILL_EVAL_LLM_API_KEY: ollama
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute PR Change Scope
        id: changes
        run: |
          python3 .github/tier2/pr_scope.py --base "${{ github.event.pull_request.base.sha }}" --output scope.json --github-output "$GITHUB_OUTPUT"

      - name: Set up uv
        if: steps.changes.outputs.run_similarity == 'true'
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"

      - name: Set up Python 3.13
        if: steps.changes.outputs.run_similarity == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install SkillEvaluator
        if: steps.changes.outputs.run_similarity == 'true'
        run: |
          uv tool install --python 3.13 "$(grep -E '^skillevaluator' requirements-skills.txt)"

      - name: Cache Model Files
        if: steps.changes.outputs.run_similarity == 'true'
        id: cache-models
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/tier2_models
          key: tier2-models-${{ hashFiles('.github/tier2/pins.env') }}-q8_0

      - name: Setup Ollama and Embedding Model
        if: steps.changes.outputs.run_similarity == 'true'
        env:
          TIER2_SKIP_LLM: "1"
          TIER2_EMBED_ADD_BOS: disabled
        run: |
          .github/tier2/setup_ollama.sh q8_0

      - name: Start Passage-Prefix Proxy
        if: steps.changes.outputs.run_similarity == 'true'
        id: start-proxy
        run: |
          echo "Starting passage-prefix proxy in background..."
          export TIER2_EMBED_PROXY_PORT=11435
          export TIER2_UPSTREAM="http://127.0.0.1:11434"
          python3 .github/tier2/embed_prefix_proxy.py > embed_proxy.log 2>&1 &
          PROXY_PID=$!
          echo "Proxy PID: $PROXY_PID"

          RETRIES=60
          until curl -s "http://127.0.0.1:11435/api/version" >/dev/null 2>&1 || [ $RETRIES -eq 0 ]; do
            sleep 1
            RETRIES=$((RETRIES - 1))
          done

          if [ $RETRIES -eq 0 ]; then
            echo "Error: Passage-prefix proxy failed to respond on http://127.0.0.1:11435/api/version within 60s" >&2
            [ -f embed_proxy.log ] && cat embed_proxy.log >&2
            exit 1
          fi

          echo "✓ Passage-prefix proxy is responding."
          echo "Effective embedding base URL: $SKILL_EVAL_EMBEDDING_BASE_URL"

      - name: Install Probe Dependency
        if: steps.changes.outputs.run_similarity == 'true'
        run: python3 -m pip install --quiet "openai>=2.21.0"

      - name: Probe Embeddings
        if: steps.changes.outputs.run_similarity == 'true'
        run: |
          python3 .github/tier2/probes/probe_embeddings.py

      - name: Run Enforced Similarity Check
        if: steps.changes.outputs.run_similarity == 'true'
        id: similarity
        run: |
          TIER2_REPORTS_DIR=tier2_reports ./eval-skills-tier2.sh | tee eval_similarity.log

      - name: Run Margin Similarity Probe
        if: always() && steps.changes.outputs.run_similarity == 'true'
        continue-on-error: true
        run: |
          skillevaluator similarity-check skills --type skill --threshold 0.65 -r json -o tier2_margin

      - name: Generate Similarity Summary
        if: always() && steps.changes.outputs.run_similarity == 'true'
        run: |
          python3 .github/tier2/pr_similarity_report.py \
            --enforced tier2_reports/similarity/skillevaluator-similarity.json \
            --margin tier2_margin/skillevaluator-similarity.json \
            --threshold 0.75 \
            --margin-threshold 0.65 \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Write Final Summary
        if: always()
        run: |
          if [ "${{ steps.changes.outputs.run_similarity }}" != 'true' ]; then
            echo "No files under skills/ or in the Tier 2 pipeline changed; Tier 2 similarity was not needed." >> "$GITHUB_STEP_SUMMARY"
          fi

  dedup-advisory:
    name: "Tier 2 dedup (advisory)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Findings never fail this job; it goes red only when the scan could not run. The sticky PR comment needs
    # pull-requests: write and the neutral "Tier 2 dedup findings (advisory)" check row needs checks: write.
    permissions:
      contents: read
      pull-requests: write
      checks: write
    env:
      TIER2_MODE: dedup
      OLLAMA_HOST: "127.0.0.1:11434"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_CONTEXT_LENGTH: "32768"
      SKILL_EVAL_EMBEDDING_PROVIDER: openai-compatible
      SKILL_EVAL_EMBEDDING_BASE_URL: http://127.0.0.1:11435/v1
      SKILL_EVAL_EMBEDDING_API_KEY: ollama
      SKILL_EVAL_EMBEDDING_MODEL: nemotron-3-embed-1b
      SKILL_EVAL_LLM_PROVIDER: openai-compatible
      SKILL_EVAL_LLM_BASE_URL: http://127.0.0.1:11434/v1
      SKILL_EVAL_LLM_API_KEY: ollama
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute PR Change Scope
        id: changes
        run: |
          python3 .github/tier2/pr_scope.py --base "${{ github.event.pull_request.base.sha }}" --output scope.json --github-output "$GITHUB_OUTPUT"

      - name: Read LLM Judges from Pins
        run: |
          source .github/tier2/pins.env
          {
            echo "SKILL_EVAL_LLM_MODEL=$OLLAMA_LLM_MODEL"
            echo "TIER2_LLM_PIN=$(.github/tier2/llm_pin_for.sh "$OLLAMA_LLM_MODEL")"
            echo "TIER2_SECOND_LLM_MODEL=$OLLAMA_LLM_ALT_MODEL"
            echo "TIER2_SECOND_LLM_PIN=$(.github/tier2/llm_pin_for.sh "$OLLAMA_LLM_ALT_MODEL")"
          } >> "$GITHUB_ENV"

      - name: Set up uv
        if: steps.changes.outputs.run_dedup == 'true'
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"

      - name: Set up Python 3.13
        if: steps.changes.outputs.run_dedup == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install SkillEvaluator
        if: steps.changes.outputs.run_dedup == 'true'
        run: |
          uv tool install --python 3.13 "$(grep -E '^skillevaluator' requirements-skills.txt)"

      - name: Cache Model Files
        if: steps.changes.outputs.run_dedup == 'true'
        id: cache-models
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/tier2_models
          key: tier2-models-${{ hashFiles('.github/tier2/pins.env') }}-q8_0

      - name: Setup Ollama and Models
        if: steps.changes.outputs.run_dedup == 'true'
        id: setup-ollama
        continue-on-error: true
        env:
          TIER2_EMBED_ADD_BOS: disabled
        run: |
          .github/tier2/setup_ollama.sh q8_0 "$SKILL_EVAL_LLM_MODEL"

      - name: Start Passage-Prefix Proxy
        if: steps.changes.outputs.run_dedup == 'true' && steps.setup-ollama.outcome == 'success'
        id: start-proxy
        continue-on-error: true
        run: |
          echo "Starting passage-prefix proxy in background..."
          export TIER2_EMBED_PROXY_PORT=11435
          export TIER2_UPSTREAM="http://127.0.0.1:11434"
          python3 .github/tier2/embed_prefix_proxy.py > embed_proxy.log 2>&1 &
          PROXY_PID=$!
          echo "Proxy PID: $PROXY_PID"

          RETRIES=60
          until curl -s "http://127.0.0.1:11435/api/version" >/dev/null 2>&1 || [ $RETRIES -eq 0 ]; do
            sleep 1
            RETRIES=$((RETRIES - 1))
          done

          if [ $RETRIES -eq 0 ]; then
            echo "Error: Passage-prefix proxy failed to respond on http://127.0.0.1:11435/api/version within 60s" >&2
            [ -f embed_proxy.log ] && cat embed_proxy.log >&2
            exit 1
          fi

          echo "✓ Passage-prefix proxy is responding."
          echo "Effective embedding base URL: $SKILL_EVAL_EMBEDDING_BASE_URL"

      - name: Install Probe Dependency
        id: probe-deps
        if: steps.changes.outputs.run_dedup == 'true' && steps.start-proxy.outcome == 'success'
        continue-on-error: true
        run: python3 -m pip install --quiet "openai>=2.21.0"

      - name: Probe Embeddings
        id: probe
        if: steps.changes.outputs.run_dedup == 'true' && steps.start-proxy.outcome == 'success'
        continue-on-error: true
        run: |
          python3 .github/tier2/probes/probe_embeddings.py

      # The scan script exits 1 both for duplicate findings and for failures, so this step must not fail the job:
      # the report step reads the JSON reports and decides.
      - name: Run Dedup Scan on Touched Skills (first judge)
        if: steps.changes.outputs.run_dedup == 'true' && steps.start-proxy.outcome == 'success'
        id: eval-dedup
        continue-on-error: true
        env:
          DEDUP_SKILLS: ${{ steps.changes.outputs.dedup_skills }}
        run: |
          TIER2_SKILLS="$DEDUP_SKILLS" TIER2_REPORTS_DIR=tier2_reports ./eval-skills-tier2.sh | tee eval_dedup.log

      # The second judge cross-checks only what the first judge flagged: a candidate is raised only when both agree,
      # so scanning unflagged skills a second time could never change the outcome.
      - name: Select Skills for the Second Judge
        if: steps.changes.outputs.run_dedup == 'true' && steps.start-proxy.outcome == 'success'
        id: second-select
        run: |
          python3 .github/tier2/pr_dedup_report.py select-second-pass \
            --scope scope.json \
            --reports tier2_reports \
            --github-output "$GITHUB_OUTPUT"

      - name: Pull Second Judge
        if: steps.second-select.outputs.run_second_pass == 'true'
        id: second-pull
        continue-on-error: true
        run: |
          .github/tier2/pull_llm.sh "$TIER2_SECOND_LLM_MODEL"

      - name: Run Dedup Scan on Flagged Skills (second judge)
        if: steps.second-select.outputs.run_second_pass == 'true' && steps.second-pull.outcome == 'success'
        id: eval-second
        continue-on-error: true
        env:
          SECOND_SKILLS: ${{ steps.second-select.outputs.second_pass_skills }}
        run: |
          SKILL_EVAL_LLM_MODEL="$TIER2_SECOND_LLM_MODEL" TIER2_SKILLS="$SECOND_SKILLS" TIER2_REPORTS_DIR=tier2_reports_second ./eval-skills-tier2.sh | tee eval_second.log

      # The report, publish and gate steps use !cancelled() rather than always(): when a newer push cancels this run,
      # it must not post a stale "could not complete" result on the pull request.
      - name: Report Dedup Findings and Annotations
        if: ${{ !cancelled() }}
        id: report
        env:
          SETUP_OUTCOME: ${{ steps.setup-ollama.outcome }}
          PROXY_OUTCOME: ${{ steps.start-proxy.outcome }}
          PROBE_DEPS_OUTCOME: ${{ steps.probe-deps.outcome }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          SECOND_PULL_OUTCOME: ${{ steps.second-pull.outcome }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BLOCKERS=()
          [ "$SETUP_OUTCOME" = 'failure' ] && BLOCKERS+=(--blocker "Ollama or model setup failed.")
          [ "$PROXY_OUTCOME" = 'failure' ] && BLOCKERS+=(--blocker "The embedding proxy failed to start.")
          [ "$PROBE_DEPS_OUTCOME" = 'failure' ] && BLOCKERS+=(--blocker "Installing the embedding probe dependency failed.")
          [ "$PROBE_OUTCOME" = 'failure' ] && BLOCKERS+=(--blocker "The embedding probe failed, so the embeddings cannot be trusted.")
          [ "$SECOND_PULL_OUTCOME" = 'failure' ] && BLOCKERS+=(--blocker "The second judge model could not be pulled or verified against its pinned digest.")
          python3 .github/tier2/pr_dedup_report.py report \
            --scope scope.json \
            --reports tier2_reports \
            --model "${SKILL_EVAL_LLM_MODEL:-unknown}" \
            --digest "${TIER2_LLM_PIN:-}" \
            --second-reports tier2_reports_second \
            --second-model "${TIER2_SECOND_LLM_MODEL:-}" \
            --second-digest "${TIER2_SECOND_LLM_PIN:-}" \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --result-file dedup_result.json \
            --github-output "$GITHUB_OUTPUT" \
            --repo "$GITHUB_REPOSITORY" \
            --sha "$HEAD_SHA" \
            --run-url "$RUN_URL" \
            "${BLOCKERS[@]}"

      - name: Publish Dedup Result on the Pull Request
        if: ${{ !cancelled() && steps.report.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 .github/tier2/pr_dedup_publish.py \
            --result dedup_result.json \
            --repo "$GITHUB_REPOSITORY" \
            --pr "$PR_NUMBER" \
            --sha "$HEAD_SHA" \
            --run-url "$RUN_URL"

      - name: Fail When the Dedup Scan Could Not Run
        if: ${{ !cancelled() }}
        env:
          REPORT_OUTCOME: ${{ steps.report.outcome }}
          DEDUP_STATUS: ${{ steps.report.outputs.dedup_status }}
        run: |
          if [ "$REPORT_OUTCOME" != 'success' ]; then
            echo "::error title=Tier 2 dedup (advisory)::The dedup report step did not complete."
            exit 1
          fi
          if [ "$DEDUP_STATUS" = 'cannot_run' ]; then
            echo "::error title=Tier 2 dedup (advisory)::The dedup scan could not complete; see the job summary and the PR comment."
            exit 1
          fi
          echo "Dedup status: ${DEDUP_STATUS:-unknown}"
